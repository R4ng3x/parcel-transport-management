name: parcel-transport-management

services:
    db:
        image: docker.io/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        container_name: parcel-transport-db
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: odoo
            POSTGRES_PASSWORD: odoo
        volumes:
            - parcel-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
            interval: 5s
            timeout: 5s
            retries: 10

    odoo:
        image: docker.io/library/odoo:19.0@sha256:3786e47dfbdb341fc98277dbf3aae5a181adcac287d4450dc42d5bdd2f186e0c
        container_name: parcel-transport-web
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "127.0.0.1:8069:8069"
        environment:
            HOST: db
            PORT: 5432
            USER: odoo
            PASSWORD: odoo
            ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
        volumes:
            - ./addons:/mnt/extra-addons:z
            - ./config/odoo.conf:/etc/odoo/odoo.conf:z,ro
            - ./config/odoo-entrypoint.sh:/usr/local/bin/parcel-odoo-entrypoint:z,ro
            - parcel-odoo-data:/var/lib/odoo
        entrypoint:
            - /bin/sh
            - /usr/local/bin/parcel-odoo-entrypoint
        restart: unless-stopped

volumes:
    parcel-db-data:
    parcel-odoo-data:
