name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality (npm run quality)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20.19.0
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.12"

            - name: Install npm 11.16.0
              run: npm install --global npm@11.16.0

            - name: Install JavaScript dependencies
              run: npm ci

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  version: 0.9.18
                  enable-cache: false

            - name: Run quality checks
              run: npm run quality

    backend-tests:
        name: Odoo backend suite
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create ephemeral CI credentials
              shell: bash
              run: |
                  printf 'ODOO_MASTER_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
                  printf 'ODOO_TEST_DATABASE=parcel_transport_ci_%s_%s\n' \
                    "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

            - name: Start PostgreSQL
              run: docker compose up --detach --wait db

            - name: Run addon domain, security, and concurrency tests
              run: |
                  docker compose run --rm odoo \
                    --database "$ODOO_TEST_DATABASE" \
                    --init parcel_transport_management \
                    --test-enable \
                    --test-tags /parcel_transport_management \
                    --stop-after-init \
                    --log-level=test

            - name: Remove disposable services and volumes
              if: always()
              run: docker compose down --volumes --remove-orphans

    hoot-tests:
        name: Command Center HOOT suite
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            CHROME_DEB_URL: https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_150.0.7871.186-1_amd64.deb
            CHROME_DEB_SHA256: 4193e00b6d5d5969ee63f7a69596868f546aa0e8cb077b3e0bf9cc1e2c719d00
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create ephemeral CI credentials
              shell: bash
              run: |
                  printf 'ODOO_MASTER_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
                  printf 'ODOO_HOOT_DATABASE=parcel_transport_hoot_%s_%s\n' \
                    "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

            - name: Start PostgreSQL
              run: docker compose up --detach --wait db

            - name: Run Command Center HOOT behavior tests
              run: |
                  docker compose run --rm \
                    --user root \
                    --entrypoint /bin/bash \
                    --env "ODOO_HOOT_DATABASE=$ODOO_HOOT_DATABASE" \
                    --env "CHROME_DEB_URL=$CHROME_DEB_URL" \
                    --env "CHROME_DEB_SHA256=$CHROME_DEB_SHA256" \
                    odoo -c '
                      set -euo pipefail
                      curl --fail --location --retry 3 --retry-all-errors \
                        "$CHROME_DEB_URL" \
                        -o /tmp/google-chrome.deb
                      printf "%s  %s\n" "$CHROME_DEB_SHA256" /tmp/google-chrome.deb \
                        | sha256sum --check --strict -
                      apt-get update
                      apt-get install -y --no-install-recommends \
                        /tmp/google-chrome.deb \
                        python3-websocket
                      rm -rf /var/lib/apt/lists/* /tmp/google-chrome.deb
                      su -s /bin/sh odoo -c "/usr/local/bin/parcel-odoo-entrypoint odoo \
                        --database \"$ODOO_HOOT_DATABASE\" \
                        --init parcel_transport_management \
                        --test-enable \
                        --test-tags /web:WebSuite.test_unit_desktop[@parcel_transport_management/parcel_dashboard] \
                        --stop-after-init \
                        --log-level=test" 2>&1 | tee /tmp/hoot.log
                      python3 -c "import re; from pathlib import Path; text = Path(\"/tmp/hoot.log\").read_text(); assert \"[HOOT] Test suite succeeded\" in text; assert re.search(r\"\[HOOT\] Passed [1-9][0-9]* tests\", text)"
                    '

            - name: Remove disposable services and volumes
              if: always()
              run: docker compose down --volumes --remove-orphans
