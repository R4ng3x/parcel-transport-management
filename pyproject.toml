[project]
name = "parcel-transport-management"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.6.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "addons/**/i18n",
]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PIE",
    "RUF100",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "I001"]
"**/__manifest__.py" = ["B018"]

[tool.ruff.format]
docstring-code-format = true
